<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Mars Stats" />
        <title>Mars Stats</title>
        <link rel="stylesheet" href="css/style.css" />
    </head>
    <body>
        <div class="container">
            <header class="main-header">
                <!-- Podsumowanie wyników (lewa strona) -->
                <div class="stats-summary">
                    <div class="score-card kasia-card">
                        <span class="label">Kasia</span>
                        <span class="value" id="kasia-wins">0</span>
                    </div>
                    <div class="vs-divider">VS</div>
                    <div class="score-card dawid-card">
                        <span class="value" id="dawid-wins">0</span>
                        <span class="label">Dawid</span>
                    </div>
                </div>

                <div class="header-actions">
                    <div class="action-column">
                        <button id="add-game-btn" class="btn-primary">
                            <span class="icon">+</span> Nowa Gra
                        </button>
                        <a
                            href="statystyki.html"
                            id="view-stats-btn"
                            class="btn-secondary"
                        >
                            <span class="icon">📊</span> Statystyki
                        </a>
                    </div>

                    <div class="action-column">
                        <a href="remik_stats.html" class="btn-secondary">
                            <span class="icon">🎴</span> Remik
                        </a>
                        <a href="tysiac.html" class="btn-secondary">
                            <span class="icon">🃏</span> Tysiąc
                        </a>
                        <a href="gra_o_tron.html" class="btn-secondary">
                            <span class="icon">👑</span> Gra o tron
                        </a>
                        <a href="world-cup-login.html" class="btn-secondary">
                            <span class="icon">⚽</span> Mundial
                        </a>
                        <a
                            href="https://pucha10.github.io/WeseleBartkaOli/index.html"
                            class="btn-secondary"
                        >
                            <span class="icon">💒</span> Ślub
                        </a>
                    </div>
                </div>
            </header>
        </div>

        <table>
            <thead>
                <tr>
                    <th class="col-lp">LP</th>
                    <th>Korporacja</th>
                    <th style="width: 50px">WT</th>
                    <th>Nagrody</th>
                    <th>Tytuły</th>
                    <th>Plansza</th>
                    <th>Karty</th>
                    <th>Suma</th>
                    <th>Wygrana?</th>
                    <th>L.Pokoleń</th>
                    <th>Mapa</th>
                    <th>Zdj</th>
                    <th>Komentarz</th>
                    <th>Akcje</th>
                </tr>
            </thead>
            <tbody id="results_table_body"></tbody>
        </table>

        <script src="js/supaBaseScript.js"></script>
        <script src="js/maps.js"></script>
        <script src="js/corporations.js"></script>
        <script src="js/start.js"></script>
    </body>
</html>

<!doctype html>
<html lang="pl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Remik - Historia Gier</title>
        <link rel="stylesheet" href="css/remik-style.css" />
        <link href="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/css/tom-select.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/tom-select@2.4.1/dist/js/tom-select.complete.min.js"></script>
        <link rel="stylesheet" href="css/remik-style.css">
    </head>
    <body>
        <div class="container">
            <header class="main-header">
                <div class="logo-area">
                    <h1>🎴 REMIK</h1>
                </div>
                <div class="actions">
                    <button
                        id="view-players-btn"
                        class="btn-players"
                        onclick="openPlayersModal()"
                    >
                    <span class="icon"></span> Gracze
                    </button>
                    <button
                        id="new-remik-game-btn"
                        class="btn-primary"
                        onclick="toggleNewGameForm(true)"
                    >
                        <span class="icon">+</span> Nowa Gra
                    </button>
                </div>
            </header>
            <div
                id="new-game-setup"
                class="setup-container"
                style="display: none"
            >
                <div class="setup-content">
                    <h3>Konfiguracja nowej gry</h3>
                        <div style="margin-bottom: 20px;">
                        <p style="margin: 0 0 5px 0; font-weight: bold; color: #1a472a;">Hasło gry:</p>
                        <input type="text" id="new-game-password" class="setup-input" placeholder="Wpisz hasło (Hasło pozwala usuwać gry)" style="width: 100%; box-sizing: border-box;">
                    </div>
                    <p>Wpisz imiona graczy:</p>
                    <div id="player-inputs-list"></div>
                    <div class="setup-buttons">
                        <button
                            type="button"
                            class="btn-action btn-edit"
                            onclick="addPlayerInputField()"
                        >
                            + Dodaj gracza
                        </button>
                        <button
                            type="button"
                            class="btn-action btn-save"
                            onclick="startNewGame()"
                        >
                            Rozpocznij grę
                        </button>
                        <button
                            type="button"
                            class="btn-action btn-cancel"
                            onclick="toggleNewGameForm(false)"
                        >
                            Anuluj
                        </button>
                    </div>
                </div>
            </div>
            <div class="table-container">
                <table id="remik-main-table">
                    <thead>
                        <tr>
                            <th>LP</th>
                            <th>Gracze</th>
                            <th>Zwycięzca</th>
                            <th>Status</th>
                            <th>Akcje</th>
                        </tr>
                    </thead>
                    <tbody id="remik-tbody"></tbody>
                </table>
            </div>
        </div>
        <div id="players-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <header class="modal-header">
                    <h2>👤 Zarządzanie Graczami</h2>
                    <button onclick="closePlayersModal()" class="btn-close">&times;</button>
                </header>

                <div class="modal-actions-top" style="margin-bottom: 15px;">
                    <button onclick="addNewPlayerPrompt()" class="btn-primary">+ Dodaj gracza</button>
                </div>
            
                <div class="table-container" style="max-height: 300px; overflow-y: auto; box-shadow: none; border: 1px solid #eee;">
                    <table id="modal-players-table">
                        <thead>
                            <tr>
                                <th style="text-align: left; padding-left: 15px;">Imię</th>
                                <th>Akcje</th>
                            </tr>
                        </thead>
                        <tbody id="modal-players-tbody">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <script src="js/supaBaseScript.js"></script>
        <script src="js/remik-main.js"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Logowanie - Typowanie MŚ</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supaBaseScript.js"></script>
  <script src="js/world-cup-login.js" defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-center items-center px-4 py-8">

  <div class="w-full max-w-sm bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6 md:p-8">
    
    <div class="text-center mb-6">
      <span class="text-4xl">⚽</span>
      <h1 class="text-2xl font-bold tracking-tight mt-2 text-white">Mistrzostwa Świata</h1>
      <p class="text-sm text-slate-400 mt-1">Podaj swój login oraz PIN, aby wejść do gry</p>
    </div>

    <div id="alert" class="hidden p-3 mb-4 text-xs rounded-lg font-medium text-center"></div>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
          Nazwa użytkownika
        </label>
        <input 
          type="text" 
          id="username" 
          required 
          placeholder="KochamYamala"
          class="w-full bg-slate-700 text-white placeholder-slate-500 border border-slate-600 rounded-lg px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
        >
      </div>

      <div>
        <label for="pin" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">
          Twój kod PIN
        </label>
        <input 
          type="password" 
          id="pin" 
          required 
          inputmode="numeric" 
          pattern="[0-9]*"
          maxlength="8"
          placeholder="213769"
          class="w-full bg-slate-700 text-white placeholder-slate-500 border border-slate-600 rounded-lg px-4 py-3 text-sm text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-transparent transition"
        >
      </div>

      <div class="flex flex-col gap-2 pt-2">
        <button 
          type="submit" 
          id="btn-login" 
          class="w-full bg-emerald-600 hover:bg-emerald-550 text-white font-semibold py-3 px-4 rounded-lg text-sm transition active:scale-[0.98]"
        >
          Zaloguj się
        </button>
        <button 
          type="button" 
          id="btn-register" 
          class="w-full bg-slate-750 hover:bg-slate-700 text-slate-300 font-medium py-2 px-4 rounded-lg text-xs transition border border-slate-700"
        >
          Stwórz nowe konto
        </button>
      </div>
    </form>
  </div>

  <footer class="mt-8 text-xs text-slate-500">
    &copy; Dawid Puszka World Cup 2026 Predictor.
  </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Szczegóły Gry - Tysiąc</title>
    <link rel="stylesheet" href="css/remik-style.css">
    <style>
        .winner-cell { color: #1e8e3e; font-weight: bold; }
        .loser-cell { color: #d93025; }
        .info-tag { font-size: 12px; color: #666; font-style: italic; }
        .shuffler-tag { background: #eee; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #666; }
        .musik-tag { background: #ffebeb; padding: 4px 8px; border-radius: 4px; font-size: 12px; color: #d93025; font-weight: bold; }
        tfoot tr { background-color: #333; color: white; font-weight: bold; border-top: 2px solid #111; }
        .bomb-badge { background: #d93025; color: white; padding: 2px 5px; border-radius: 4px; font-size: 10px; font-weight: bold; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <header class="main-header">
            <div class="logo-area">
                <h1 id="game-title">🃏 Tysiąc - Gra #...</h1>
            </div>
            <div class="actions">
                <button id="add-round-btn" class="btn-primary btn-add-round" onclick="showAddRoundForm()">+ Dodaj rozdanie</button>
                <a href="tysiac.html" class="btn-secondary">Powrót</a>
            </div>
        </header>

        <div class="next-shuffler-box" id="next-shuffler-info">
            Następny rozdaje: <strong id="next-shuffler-name">...</strong> | 
            Na musiku: <strong id="next-musik-name">...</strong>
        </div>

        <div class="bottom-actions" id="status-button-container"></div>

        <div class="table-container" style="overflow-x: auto;">
            <table id="details-table">
                <thead id="details-thead"></thead>
                <tbody id="details-tbody"></tbody>
                <tfoot id="details-tfoot"></tfoot>
            </table>
        </div>

        <div class="bottom-actions" style="margin-top: 15px; margin-bottom: 25px;">
            <button id="add-round-btn-bottom" class="btn-primary btn-add-round" onclick="showAddRoundForm()">+ Dodaj rozdanie</button>
        </div>
    </div>

    <script src="js/supaBaseScript.js"></script>
    <script src="js/tysiac-rozdanie.js"></script>
</body>
</html>
